[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomni"
dynamic = ["version"]
description = "Biomni-AD: Alzheimer's Disease Biomedical AI Agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Biomni Team", email = "kexinh@cs.stanford.edu"}
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langgraph==0.3.18",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyarrow>=15.0",
]

[project.urls]
Homepage = "https://github.com/kuanlinhuang/Biomni"
Repository = "https://github.com/kuanlinhuang/Biomni"
Upstream = "https://github.com/snap-stanford/biomni"

[project.optional-dependencies]
# LLM provider extras — install the ones you need.
anthropic = ["langchain-anthropic>=0.2,<0.4"]
bedrock = ["langchain-aws>=0.2,<0.4"]
ollama = ["langchain-ollama>=0.2,<0.4"]
# UI extras
gradio = ["gradio>=5.0,<6.0"]
chainlit = ["chainlit>=1.0,<3"]
# Convenience meta-extra
all = [
    "langchain-anthropic>=0.2,<0.4",
    "langchain-aws>=0.2,<0.4",
    "langchain-ollama>=0.2,<0.4",
    "gradio>=5.0,<6.0",
    "chainlit>=1.0,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "biomni.version.__version__"}

[tool.setuptools.packages.find]
exclude = ["test*", "tutorials*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",      # Errors detected by Pyflakes
    "E",      # Error detected by Pycodestyle
    "W",      # Warning detected by Pycodestyle
    "I",      # isort
    #"D",      # pydocstyle
    "B",      # flake8-bugbear
    "TID",    # flake8-tidy-imports
    "C4",     # flake8-comprehensions
    "BLE",    # flake8-blind-except
    "UP",     # pyupgrade
    "RUF100", # Report unused noqa directives
    "TCH",    # Typing imports
    #"NPY",    # Numpy specific rules
    #"PTH",    # Use pathlib
    #"PL"      # pylint
]
ignore = [
    # line too long -> we accept long comment lines; black gets rid of long code lines
    "E501",
    # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
    "E731",
    # allow I, O, l as variable names -> I is the identity matrix
    "E741",
    # Missing docstring in public package
    "D104",
    # Missing docstring in public module
    "D100",
    # Missing docstring in __init__
    "D107",
    # Errors from function calls in argument defaults. These are fine when the result is immutable.
    "B008",
    # __magic__ methods are are often self-explanatory, allow missing docstrings
    "D105",
    # first line should end with a period [Bug: doesn't work with single-line docstrings]
    "D400",
    # First line should be in imperative mood; try rephrasing
    "D401",
    ## Disable one in each pair of mutually incompatible rules
    # We don’t want a blank line before a class docstring
    "D203",
    # We want docstrings to start immediately after the opening triple quote
    "D213",
    # camcelcase imported as lowercase
    "N813",
    # module import not at top level of file
    "E402",
    # Too many arguments in function definition
    "PLR0913",
    # Too many branches
    "PLR0912",
    # magic value used in comparison
    "PLR2004",
    # Too many statements
    "PLR0915",
    # Extracting value from dictionary without calling `.items()` - clashes with sim
    "PLC0206",
    # import should be at top of file
    "PLC0415",
    # do not catch blind exception
    "BLE001",
    # strip with multi characters
    "B005"
]
