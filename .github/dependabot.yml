# Dependabot configuration
#
# Scoped narrowly to deployment-surface ecosystems. We deliberately do NOT
# enable pip dependency updates here: biomni's Python deps are pinned via
# pyproject.toml ranges plus the conda env file, and Dependabot's pip
# updater doesn't understand environment.yml. That story belongs to a uv
# lockfile later (audit item #11).
#
# Both ecosystems below are pure-CI / pure-base-image — no application code
# is changed by Dependabot PRs, so they're safe to auto-merge once green.

version: 2
updates:
  # GitHub Actions used in .github/workflows/*.yml — keep them current so
  # supply-chain advisories don't sit unpatched.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Dockerfile FROM line. Bumps the micromamba base image when upstream
  # releases a new tag. We pin the base by digest, so this surfaces as an
  # actionable PR (new tag + new digest) rather than a silent drift.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
