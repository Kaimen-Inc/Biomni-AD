name: Docker image

# Two responsibilities, one file:
#   1. On every PR that touches Docker / packaging files, run `docker build`
#      so a broken Dockerfile is caught at PR time instead of at deploy time.
#   2. On push to long-lived branches and tags, push the image to GHCR so
#      operators can `docker pull ghcr.io/<owner>/biomni-ad:<tag>` rather
#      than building locally or shipping a tarball.
#
# The build job runs on every relevant change; the publish job is gated on
# the push event and skips for PRs (where pushing would be wrong anyway).

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker/**"
      - "biomni_env/environment.yml"
      - "pyproject.toml"
      - "biomni/**"
      - "chainlit_app.py"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
      - biomni-ad
      - feat/adworkbench
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (verify Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify the image builds. No push, no registry login — this job
      # protects PRs and is the canary for the publish job below.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: biomni-ad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Surface build-time vulnerabilities and provenance info in the
          # build summary; doesn't fail the job on findings.
          provenance: false

  publish:
    name: Build & publish to GHCR
    # Only push on push events (branch / tag), not PRs — pushing PR builds
    # would require a token that PRs from forks shouldn't have anyway.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   - branch name  (refs/heads/main → :main)
      #   - git SHA short (always — primary content-addressed tag)
      #   - semver tag   (v1.2.3 → :1.2.3 + :1.2 + :latest)
      # SHA tag is what production should pin to; branch and semver tags
      # are convenience aliases.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Biomni-AD
            org.opencontainers.image.description=Alzheimer's-specialized biomedical AI agent (Chainlit UI)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Annotate the image manifest with the source commit so operators
          # can recover provenance from a pulled image alone.
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
