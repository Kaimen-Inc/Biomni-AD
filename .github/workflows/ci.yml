name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/adworkbench

# Nothing here writes to the repository or to a pull request.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the release in the comment; Dependabot
# (.github/dependabot.yml) proposes the updates.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned to the exact version in biomni_env/*.yml so CI and local dev
        # agree on what "formatted" means - an open range let ruff 0.16 (which
        # started formatting Python fences inside Markdown files) flag files
        # nobody had checked locally since they were pinned to 0.12.7.
        run: pip install "ruff==0.12.7"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A test that leaves a thread running keeps pytest from exiting, and the
    # default limit is six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Verify cheap import
        run: python -c "import biomni; print('biomni', biomni.__version__)"
      - name: Run pytest
        run: python -m pytest -v

  # The tests of the app itself skip without Chainlit, so the job above never
  # runs them. It installs no extras on purpose: it checks that the pure modules
  # need none. This one installs the extra, which pins the Chainlit version the
  # image ships, and runs everything.
  test-chainlit:
    name: Test with Chainlit (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The interpreter the image ships (python=3.11.13 in biomni_env/adworkbench_env.yml).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + chainlit extra + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chainlit]" pytest
      - name: Run pytest
        run: python -m pytest -v

  compile:
    name: Compile-check all Python files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: py_compile
        run: |
          python -m compileall -q biomni chainlit_app.py tests

  typecheck:
    name: Type-check (mypy, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only: report findings without blocking PRs. Once the scoped
    # set is clean across the wider tree we'll drop continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install "mypy>=1.10,<2"
      - name: Run mypy on scoped files
        # Scope intentionally narrow - these are the files we own outright
        # post-refactor. Follow-imports silent so we don't drown in errors
        # from the legacy god-files until they're decomposed.
        run: |
          mypy \
            --ignore-missing-imports \
            --follow-imports=silent \
            biomni/artifact.py \
            biomni/config.py \
            biomni/credentials.py \
            biomni/env_probe.py \
            biomni/health.py \
            biomni/identity.py \
            biomni/llm.py \
            biomni/llm_proxy.py \
            biomni/observability.py \
            biomni/status.py \
            biomni/tool/availability.py \
            biomni/workspace_prefs.py \
            chainlit_ui/graph_stream.py \
            chainlit_ui/llm_failures.py \
            chainlit_ui/ui_flags.py \
            chainlit_ui/workspace_panel.py
